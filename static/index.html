 <div class="kpis"><div class="card kpi"><div class="k">Source files</div><div class="v">${s.sources.length}</div></div><div class="card kpi"><div class="k">Last refresh</div><div class="v" style="font-size:15px">${fmtUTC(r.last_successful_refresh_utc)}</div></div><div class="card kpi"><div class="k">Next run</div><div class="v" style="font-size:15px">${r.next_scheduled_run_utc6||'unavailable'} UTC-6</div><div class="s">${esc(r.schedule||'')}</div></div><div class="card kpi"><div class="k">Model</div><div class="v" style="font-size:18px">${esc(s.model_version)}</div></div></div>
 <div class="card pad" style="margin-bottom:12px"><h3>Unavailable data</h3>${Object.entries(s.unavailable).map(([k,v])=>`<div class="kv"><span class="warn">${esc(k)}</span><span class="small" style="font-weight:400;max-width:70%;color:var(--tx2)">${esc(v)}</span></div>`).join('')}<p class="note">Optional key sources configured: ${esc(JSON.stringify(s.optional_api_keys))}. Fixtures: ${esc(s.fixtures_source)}</p></div>
 ${s.psl&&s.psl.results_by_season?.length?`<div class="card pad" style="margin-bottom:12px"><h3>${flag('PSL')} ${esc(s.psl.name)} – ${esc(s.psl.source)}</h3><div class="scroll"><table class="t2"><tr><th>Season</th><th class="n">Results</th><th>Check</th><th>Wikipedia revision</th></tr>${s.psl.results_by_season.map(r=>{const v=(s.psl.validation||{}).seasons?.[r.season]||{};return `<tr><td><a style="color:var(--ac)" href="${esc(r.source_url)}">PSL ${esc(r.season)}</a></td><td class="n">${r.n}</td><td>${esc(r.data_status)}</td><td>${esc(v.revision_timestamp||'—')} (fetched ${esc(v.fetched_at||'—')})</td></tr>`}).join('')}</table></div><p class="note">PSL: no dates, odds or shots in source; upcoming fixtures ${esc(s.psl.fixtures)}.</p></div>`:''}
 <div class="card"><div class="scroll"><table class="t2"><tr><th>File</th><th class="n">Rows</th><th>Latest match</th><th>Fetched (UTC)</th><th>Server Last-Modified</th></tr>${s.sources.map(r=>`<tr><td><a style="color:var(--ac)" href="${esc(r.url)}" rel="noopener">${esc(r.file)}</a>${r.error?` <span class="t r">${esc(r.error)}</span>`:''}</td><td class="n">${r.rows}</td><td>${esc(r.latest_match||'—')}</td><td>${esc(r.fetched_at||'unavailable')}</td><td>${esc(r.last_modified||'unavailable')}</td></tr>`).join('')}</table></div></div></div>`}
function settings(){const s=S.settings,L=S.status.leagues,groups={};Object.keys(L).forEach(k=>{const c=ctry(k)[0];(groups[c]=groups[c]||[]).push(k)});
 return `<div class="pg" style="max-width:900px"><h1>Settings</h1><p class="note" style="margin:0 0 14px">Leagues and the betting module are stored on the server. Pins and favourites stay in this browser.</p>
 <div class="card pad" style="margin-bottom:12px"><h3>Betting / odds module</h3><label style="display:flex;gap:12px;align-items:center;cursor:pointer"><span class="sw"><input id="bet" type="checkbox" ${s.betting_module?'checked':''}><span></span></span><span>Enable odds & value analysis <span class="muted small">(off by default · 18+, gamble responsibly)</span></span></label></div>
 <div class="card pad" style="margin-bottom:12px"><h3>Timezone</h3><div>${esc(s.timezone)}</div></div>
 <div class="card pad" style="margin-bottom:12px"><div style="display:flex;align-items:center;margin-bottom:8px"><h3 style="margin:0;flex:1">Leagues shown</h3><button class="small" style="color:var(--g)" onclick="document.querySelectorAll('.lgc').forEach(x=>x.checked=true)">Select all</button><span class="muted" style="margin:0 8px">·</span><button class="small" style="color:var(--tx2)" onclick="document.querySelectorAll('.lgc').forEach(x=>x.checked=false)">None</button></div>
 <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:2px">${Object.keys(groups).sort().flatMap(c=>groups[c]).map(k=>`<label class="cb"><input type="checkbox" class="lgc" value="${k}" ${s.leagues.includes(k)?'checked':''}>${flag(k)} <span>${esc(L[k])}</span></label>`).join('')}</div></div>
 <button class="btn" onclick="save()">Save settings</button></div>`}
async function save(){S.settings=await fetch('/api/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({leagues:[...document.querySelectorAll('.lgc:checked')].map(x=>x.value),betting_module:$('#bet').checked})}).then(r=>r.json());await loadFx();toast('Settings saved')}
// ---------- router ----------
async function route(){nav();const [p,id]=location.hash.slice(1).split('/'),v=$('#view');
 if(p=='match'&&id){if(!$('#main')){v.innerHTML=home();dates();renderList()}showMatch(id);return}
 $('#drawer').classList.remove('on');$('#scrim').classList.remove('on');document.body.style.overflow='';
 const page={home,perf,odds,data,settings}[p||'home']||home;v.innerHTML=await page();window.scrollTo(0,0);if(page==home){dates();renderList()}}
window.addEventListener('popstate',route);
let qt;$('#q').addEventListener('input',e=>{clearTimeout(qt);qt=setTimeout(()=>{S.q=e.target.value;if(!$('#list'))location.hash='#home';else renderList(true)},120)});
document.addEventListener('keydown',e=>{const tag=document.activeElement.tagName;if((e.key=='/'&&!/INPUT|TEXTAREA|SELECT/.test(tag))||((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()=='k')){e.preventDefault();$('#q').focus();$('#q').select()}
 if(e.key=='Escape'){if(document.activeElement==$('#q'))$('#q').blur();closeAll()}});
setInterval(()=>{const n=S.fx.length;S.fx=S.fx.filter(isUpcoming);if(S.fx.length!=n&&$('#list')){dates();renderList(true)}},60000);
(async()=>{nav();$('#view').innerHTML=`<div class="wrap"><aside class="side"></aside><main><div id="list">${skel()}</div></main></div>`;
 try{await load();api('/api/ssi').then(x=>S.ssi=x).catch(()=>{});if(!S.perf)api('/api/performance').then(x=>S.perf=S.perf||x).catch(()=>{});
  if(S.day!='all'&&(S.day<todayKey()||!S.fx.some(x=>fxDay(x)==S.day)))S.day='all';await route()}
 catch(e){$('#view').innerHTML=`<div class="pg"><div class="card empty"><b>Could not load data</b>${esc(e.message)}</div></div>`;console.error(e)}})();
</script></body></html>
