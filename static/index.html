<!doctype html><html lang="en" class="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SUPER SOCCER AI</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>body{background:#0b1020}.card{background:#121a2e;border:1px solid #1f2a44;border-radius:14px;padding:16px}.nav a.active{background:#1d4ed8;color:#fff}
th{cursor:pointer;user-select:none}td,th{padding:6px 8px}tr:hover td{background:#18223b}.pill{font-size:11px;padding:2px 8px;border-radius:999px;background:#1f2a44;margin:1px;display:inline-block}</style></head>
<body class="text-slate-200 font-sans">
<header class="border-b border-slate-800 sticky top-0 bg-[#0b1020]/95 backdrop-blur z-10"><div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center gap-4">
<div><div class="text-xl font-extrabold tracking-wide text-emerald-400">SUPER SOCCER AI</div><div class="text-xs text-slate-400">Research the Game. Predict the Score. Measure the Evidence.</div></div>
<nav class="nav flex flex-wrap gap-1 text-sm ml-auto" id="nav"></nav></div></header>
<main class="max-w-7xl mx-auto p-4" id="app">Loading…</main>
<footer class="text-center text-xs text-slate-500 p-6">Data: football-data.co.uk (free historical CSVs). Probabilities are estimates; no outcome or profit is guaranteed. Times shown in UTC-6.</footer>
<script>
const pages={home:"Home",match:"Match research",pred:"Prediction centre",odds:"Odds centre",perf:"Performance centre",settings:"Settings"};
let S={status:null,fx:[],perf:null,settings:null,sort:"kickoff",desc:false,league:""};
const pct=x=>x==null?"unavailable":(100*x).toFixed(1)+"%", f2=x=>x==null?"unavailable":(+x).toFixed(2);
const api=p=>fetch(p).then(r=>r.json());
function nav(){document.getElementById('nav').innerHTML=Object.entries(pages).map(([k,v])=>`<a href="#${k}" class="px-3 py-1.5 rounded-lg hover:bg-slate-800 ${location.hash.slice(1).split('/')[0]==k||(!location.hash&&k=='home')?'active':''}">${v}</a>`).join('')}
async function load(){[S.status,S.settings]=await Promise.all([api('/api/status'),api('/api/settings')]);await loadFx()}
async function loadFx(){S.fx=await api(`/api/fixtures?sort=${S.sort}&desc=${S.desc}`+(S.league?`&league=${S.league}`:''));S.fx=S.fx.filter(x=>S.settings.leagues.includes(x.league)&&isUpcoming(x))}
function isUpcoming(x){const k=x.kickoff_utc6?x.kickoff_utc6.replace(' ','T')+':00-06:00':(x.date+'T23:59:00-06:00');const t=Date.parse(k);return isNaN(t)||t>Date.now()}
function setSort(k){if(S.sort==k)S.desc=!S.desc;else{S.sort=k;S.desc=k!='kickoff'&&k!='league'}loadFx().then(route)}
function fxTable(rows){const h=(k,l)=>`<th onclick="setSort('${k}')" class="text-left">${l}${S.sort==k?(S.desc?' ▼':' ▲'):''}</th>`;
return `<div class="overflow-x-auto"><table class="w-full text-sm"><thead class="text-slate-400 text-xs uppercase"><tr>${h('league','League')}${h('kickoff','Kickoff UTC-6')}<th>Match</th><th>Pick</th>${h('probability','Prob')}<th>1 / X / 2</th><th>Top score</th>${h('goals','Model xG')}${h('ssi','SSI')}${h('quality','Data')}<th>Categories</th><th>Fixture source</th></tr></thead><tbody>`+
rows.map(x=>{const src=`<td class="text-xs text-slate-500" title="${x.fixture_source||''}">${(x.fixture_source||'').split('/').pop()}<br>${(x.fixture_fetched_at||'').replace('T',' ').slice(0,16)} UTC</td>`;
if(x.predicted===false)return `<tr class="border-t border-slate-800"><td>${x.league}</td><td class="whitespace-nowrap">${x.kickoff_utc6||x.date}</td><td>${x.home} v ${x.away}</td><td colspan=7 class="text-amber-300 text-xs">insufficient data – ${x.reason}</td><td><span class=pill>insufficient data</span></td>${src}`;
return `<tr class="border-t border-slate-800"><td>${x.league}${x.backtested===false?' <span class="pill" title="not in walk-forward backtest">untested</span>':''}</td><td class="whitespace-nowrap">${x.kickoff_utc6||x.date}</td><td><a class="text-sky-400 hover:underline" href="#match/${x.match_id}">${x.home} v ${x.away}</a></td><td>${x.predicted_outcome}</td><td>${pct(x.probability)}</td><td class="whitespace-nowrap">${pct(x.markets['1X2'].home)} / ${pct(x.markets['1X2'].draw)} / ${pct(x.markets['1X2'].away)}</td><td>${x.markets.top_scores[0].score} (${pct(x.markets.top_scores[0].p)})</td><td>${f2(x.markets.model_expected_goals.total)}</td><td><b class="${x.ssi>=60?'text-emerald-400':x.ssi>=45?'text-amber-300':'text-rose-400'}">${x.ssi}</b></td><td>${x.data_quality}</td><td>${x.categories.map(c=>`<span class=pill>${c}</span>`).join('')}</td>${src}</tr>`}).join('')+`</tbody></table></div>`}
function leagueFilter(){return `<select onchange="S.league=this.value;loadFx().then(route)" class="bg-slate-900 border border-slate-700 rounded px-2 py-1 text-sm"><option value="">All leagues</option>${S.settings.leagues.map(l=>`<option ${S.league==l?'selected':''} value="${l}">${l} – ${S.status.leagues[l]}</option>`).join('')}</select>`}
function home(){const s=S.status;const up=s.mode=='upcoming';
return `<div class="grid md:grid-cols-4 gap-4 mb-4">${[["Mode",up?"Upcoming fixtures (real source)":"HISTORICAL MODE – no upcoming fixtures"],["Upcoming predictions",s.n_upcoming],["Predictions generated (UTC)",s.predictions_created_at||'—'],["Model",s.model_version],["Last successful refresh (UTC)",(s.refresh||{}).last_successful_refresh_utc||'—'],["Next scheduled run (UTC-6)",(s.refresh||{}).next_scheduled_run_utc6||'—']].map(([a,b])=>`<div class=card><div class="text-xs text-slate-400">${a}</div><div class="text-lg font-semibold">${b}</div></div>`).join('')}</div>
<div class="card mb-4"><div class="flex items-center justify-between mb-2"><h2 class="font-bold">Upcoming fixtures</h2>${leagueFilter()}</div><p class="text-xs text-slate-400 mb-2">Source: ${s.fixtures_source}. The most likely exact score is usually under 15% likely.</p>${fxTable(S.fx)}</div>
<div class="card"><h2 class="font-bold mb-2">Data sources & timestamps</h2><div class="overflow-x-auto"><table class="text-xs w-full"><tr class="text-slate-400"><th class=text-left>File</th><th>Rows</th><th>Latest match</th><th>Fetched (UTC)</th><th>Server Last-Modified</th></tr>${s.sources.map(r=>`<tr class="border-t border-slate-800"><td><a class=text-sky-400 href="${r.url}">${r.file}</a></td><td>${r.rows}</td><td>${r.latest_match||'—'}</td><td>${r.fetched_at||'unavailable'}</td><td>${r.last_modified||'unavailable'}</td></tr>`).join('')}</table></div>
${s.psl&&s.psl.results_by_season.length?`<h3 class="font-bold mt-3 text-sm">${s.psl.name} - ${s.psl.source}</h3><table class="text-xs w-full"><tr class="text-slate-400"><th class=text-left>Season</th><th>Results</th><th>Check</th><th>Wikipedia revision</th></tr>${s.psl.results_by_season.map(r=>{const v=(s.psl.validation||{}).seasons?.[r.season]||{};return `<tr class="border-t border-slate-800"><td><a class=text-sky-400 href="${r.source_url}">PSL ${r.season}</a></td><td>${r.n}</td><td>${r.data_status}</td><td>${v.revision_timestamp||'—'} (fetched ${v.fetched_at||'—'})</td></tr>`}).join('')}</table><p class="text-xs text-slate-400">PSL: no dates, odds or shots in source; upcoming fixtures ${s.psl.fixtures}.</p>`:''}
<p class="text-xs text-amber-300 mt-2">Unavailable: ${Object.values(s.unavailable).join('; ')}. Optional key sources configured: ${JSON.stringify(s.optional_api_keys)}</p></div>`}
function heat(M){const mx=Math.max(...M.flat());return `<table class="text-xs"><tr><td class="text-slate-500">H\\A</td>${M[0].map((_,j)=>`<td class="text-center text-slate-400">${j}</td>`).join('')}</tr>`+M.map((r,i)=>`<tr><td class="text-slate-400">${i}</td>${r.map(v=>`<td style="background:rgba(16,185,129,${(v/mx).toFixed(2)})" class="w-12 h-9 text-center">${(100*v).toFixed(1)}</td>`).join('')}</tr>`).join('')+`</table>`}
function formList(r){return r.map(x=>`<div class="text-xs py-0.5">${x.date} · ${x.home} <b>${x.score}</b> ${x.away}</div>`).join('')||'<div class="text-xs text-slate-500">unavailable</div>'}
async function match(id){if(!id){return `<div class=card><p class="mb-2">Pick a fixture:</p>${fxTable(S.fx)}</div>`}
const d=await api('/api/match/'+id);if(d.detail)return `<div class=card>${d.detail}</div>`;const m=d.markets;
const kv=(o)=>Object.entries(o).map(([k,v])=>`<div class="flex justify-between"><span class=text-slate-400>${k}</span><span>${typeof v=='object'?Object.entries(v).map(([a,b])=>a+': '+pct(b)).join(' · '):pct(v)}</span></div>`).join('');
return `<div class="card mb-4"><div class="text-xs text-slate-400">${d.league_name} · ${d.kickoff_utc6} UTC-6 · predicted ${d.created_at} UTC · ${d.model_version}</div><h1 class="text-2xl font-bold">${d.home} <span class=text-slate-500>v</span> ${d.away}</h1>
<div class="flex flex-wrap gap-4 mt-2 text-sm"><span>Pick: <b>${d.predicted_outcome}</b> (${pct(d.probability)}, ${d.confidence} confidence)</span><span>SSI <b>${d.ssi}</b>/100</span><span>Data quality <b>${d.data_quality}</b></span><span>Model agreement ${pct(d.model_agreement)}</span></div><div class=mt-1>${d.categories.map(c=>`<span class=pill>${c}</span>`).join('')}</div></div>
<div class="grid lg:grid-cols-2 gap-4"><div class=card><h3 class="font-bold mb-2">Score matrix (%), 0–6 goals</h3>${heat(d.score_matrix)}<p class="text-xs text-slate-400 mt-2">Top 3: ${m.top_scores.map(t=>t.score+' '+pct(t.p)).join(', ')}. ${d.notes.join(' ')}</p></div>
<div class="card text-sm"><h3 class="font-bold mb-2">Markets</h3><div class="flex justify-between"><span class=text-slate-400>Model expected goals</span><span>${f2(m.model_expected_goals.home)} – ${f2(m.model_expected_goals.away)} (total ${f2(m.model_expected_goals.total)})</span></div>${kv({"1X2":m['1X2'],"Double chance":m.double_chance,"Draw no bet":m.draw_no_bet,"BTTS":m.btts})}${Object.entries(m.over_under).map(([t,v])=>`<div class="flex justify-between"><span class=text-slate-400>O/U ${t}</span><span>${pct(v.over)} / ${pct(v.under)}</span></div>`).join('')}${kv({"Home goals":m.team_goals.home,"Away goals":m.team_goals.away})}
<h4 class="font-semibold mt-3">Per model 1X2</h4>${Object.entries(d.per_model_1x2).map(([k,v])=>`<div class="flex justify-between"><span class=text-slate-400>${k}</span><span>${v.map(pct).join(' / ')}</span></div>`).join('')}
<h4 class="font-semibold mt-3">SSI factors (0–1)</h4>${Object.entries(d.ssi_factors).map(([k,v])=>`<div class="flex justify-between"><span class=text-slate-400>${k}</span><span>${v.toFixed(2)}</span></div>`).join('')}</div>
<div class=card><h3 class="font-bold mb-1">${d.home} – last 5</h3>${formList(d.form_home)}<h3 class="font-bold mt-3 mb-1">${d.away} – last 5</h3>${formList(d.form_away)}</div><div class=card><h3 class="font-bold mb-1">Head to head (in dataset, since 2021)</h3>${formList(d.h2h)}</div></div>`}
function pred(){return `<div class=card><div class="flex justify-between mb-2"><h2 class=font-bold>Prediction centre</h2>${leagueFilter()}</div><p class="text-xs text-slate-400 mb-2">Click column headers to sort by league, kickoff, probability, model goals, SSI or data quality. SSI measures reliability of the research, not the size of the favourite.</p>${fxTable(S.fx)}</div>`}
async function odds(){const v=await api('/api/value');if(!v.betting_module_enabled)return `<div class=card>Betting module is <b>off</b>. Enable it in Settings to view odds/value analysis. ${v.disclaimer}</div>`;
return `<div class=card><h2 class="font-bold">Odds centre</h2><p class="text-xs text-amber-300 mb-2">${v.disclaimer} Rule: edge ≥ ${v.rule.min_edge}, EV ≥ ${v.rule.min_ev}, odds ≤ ${v.rule.max_odds}, and model must pass the validation gate for the league.</p><div class=overflow-x-auto><table class="text-sm w-full"><tr class="text-slate-400 text-xs"><th class=text-left>Match</th><th>Sel</th><th>Odds</th><th>Implied</th><th>Fair (no margin)</th><th>Model</th><th>Edge</th><th>EV</th><th>Margin</th><th>Flag</th></tr>`+
v.rows.flatMap(r=>r.value.selections.map(s=>`<tr class="border-t border-slate-800"><td>${r.league} · ${r.home} v ${r.away}</td><td>${s.selection}</td><td>${s.odds}</td><td>${pct(s.implied)}</td><td>${pct(s.fair_implied)}</td><td>${pct(s.model_p)}</td><td class="${s.edge>0?'text-emerald-400':'text-rose-400'}">${pct(s.edge)}</td><td>${pct(s.ev)}</td><td>${pct(r.value.bookmaker_margin)}</td><td>${s.potential_value?'<span class="text-emerald-400 font-bold">potential value</span>':(r.value.model_validated?'—':'model not validated')}</td></tr>`)).join('')+`</table></div></div>`}
async function perf(){const p=S.perf||(S.perf=await api('/api/performance'));if(!p.available)return '<div class=card>No backtest yet.</div>';const o=p.overall;
const row=(n,b)=>b?`<tr class="border-t border-slate-800"><td>${n}</td><td>${b.n}</td><td>${pct(b.accuracy)} <span class=text-slate-500>[${pct(b.accuracy_ci[0])}, ${pct(b.accuracy_ci[1])}]</span></td><td>${b.log_loss??'–'} ${b.log_loss_ci?`<span class=text-slate-500>[${b.log_loss_ci}]</span>`:''}</td><td>${b.brier??'–'}</td><td>${b.rps??'–'}</td></tr>`:'';
setTimeout(()=>{new Chart(document.getElementById('cal'),{type:'scatter',data:{datasets:[{label:'Ensemble',data:o.calibration_bins.map(c=>({x:c.mean_pred,y:c.observed})),backgroundColor:'#10b981',pointRadius:6},{label:'Perfect',type:'line',data:[{x:0,y:0},{x:1,y:1}],borderColor:'#64748b',pointRadius:0}]},options:{scales:{x:{min:0,max:1,title:{display:true,text:'predicted'}},y:{min:0,max:1,title:{display:true,text:'observed'}}}}});
const L=Object.entries(p.by_league);new Chart(document.getElementById('lg'),{type:'bar',data:{labels:L.map(x=>x[0]),datasets:[{label:'Ensemble RPS',data:L.map(x=>x[1].ens.rps),backgroundColor:'#10b981'},{label:'Base rates RPS',data:L.map(x=>x[1].base.rps),backgroundColor:'#64748b'},{label:'Bookmaker closing RPS',data:L.map(x=>x[1].bookmaker_closing?.rps),backgroundColor:'#f59e0b'}]},options:{scales:{y:{beginAtZero:false}}}})},50);
const vr=p.value_rule_all_leagues;
return `<div class="card mb-4"><h2 class=font-bold>Walk-forward backtest (${o.n_matches} test matches)</h2><p class="text-xs text-slate-400">Models refit weekly on matches strictly before each week. Ensemble weights ${JSON.stringify(p.weights)} chosen on validation season (n=${p.validation.n}). 95% bootstrap CIs. Lower log loss/Brier/RPS is better.</p>
<div class=overflow-x-auto><table class="text-sm w-full mt-2"><tr class="text-slate-400 text-xs"><th class=text-left>Model</th><th>n</th><th>Accuracy</th><th>Log loss</th><th>Brier</th><th>RPS</th></tr>${row('Ensemble',o.ens)}${row('Poisson',o.poisson)}${row('Dixon-Coles',o.dc)}${row('Elo',o.elo)}${row('Logistic',o.logit)}${row('Base rates',o.base)}${row('Home always',o.home_always)}${row('Bookmaker closing (subset)',o.bookmaker_closing)}${row('Ensemble (same subset)',o.ensemble_on_same_matches)}</table></div>
<p class="text-sm mt-2">Exact-score hit rate ${pct(o.exact_score_hit_rate.rate)} (mean top-score prob ${pct(o.exact_score_hit_rate.mean_top_score_prob)}). Goals MAE ${o.goals_mae.model} vs ${o.goals_mae.baseline_train_mean} baseline. Ensemble − bookmaker log loss: ${o.ens_minus_book_logloss.mean} [${o.ens_minus_book_logloss.ci}]. ECE ${o.ece}.</p>
<p class="text-sm mt-1 text-amber-300">Value rule ROI (v0.2, all leagues): ${vr.n_bets} bets, ROI ${pct(vr.roi)} [${pct(vr.roi_ci95[0])}, ${pct(vr.roi_ci95[1])}]${p.value_rule_v01_all_leagues?` (v0.1: ${p.value_rule_v01_all_leagues.n_bets} bets, ROI ${pct(p.value_rule_v01_all_leagues.roi)})`:''}${p.value_rule_model_plus_market_all_leagues?`; model+market: ${p.value_rule_model_plus_market_all_leagues.n_bets} bets, ROI ${pct(p.value_rule_model_plus_market_all_leagues.roi)} [${pct(p.value_rule_model_plus_market_all_leagues.roi_ci95[0])}, ${pct(p.value_rule_model_plus_market_all_leagues.roi_ci95[1])}]`:''}. Validated leagues: ${p.validated_leagues.join(', ')||'none'}.</p></div>
<div class="card mb-4 text-sm"><h3 class="font-bold mb-1">How the v0.2 model works</h3>
<p class="text-slate-300">Core: a Dixon-Coles model whose attack/defence ratings, per-league home advantage and low-score correction (rho) are fitted <b>jointly</b> by time-weighted maximum likelihood (half-life ~1 year, chosen on the validation season). Teams new to a league are shrunk towards a jointly estimated "promoted team" strength instead of the league average. Its expected goals are blended (geometric, ${p.v2?p.v2.alpha:''} goals / ${p.v2?(1-p.v2.alpha).toFixed(1):''} shots) with ratings fitted on <b>shots on target – an xG proxy, not real xG</b>. The resulting 1X2 is pooled with a logistic model on Elo and recent form (weights ${p.v2?p.v2.w_core.toFixed(2)+' / '+p.v2.w_logit.toFixed(2):''}), then recalibrated (temperature ${p.v2?p.v2.T.toFixed(3):''}, draw shift ${p.v2?p.v2.d.toFixed(3):''}). Every choice was made on the validation season only; test seasons were scored once. Tried and rejected on validation: other half-lives, inherited Elo for promoted teams, extra logistic features, gradient boosting.</p>
<p class="mt-2">Before → after on ${o.n_matches} test matches: log loss ${o.ens_v01?o.ens_v01.log_loss:'–'} → <b>${o.ens.log_loss}</b>, RPS ${o.ens_v01?o.ens_v01.rps:'–'} → <b>${o.ens.rps}</b>${o.v02_minus_v01?` (paired difference ${o.v02_minus_v01.log_loss} [${o.v02_minus_v01.log_loss_ci}])`:''}. Bookmaker closing odds remain clearly better: gap ${o.ens_v01_minus_book_logloss?o.ens_v01_minus_book_logloss.mean:'–'} → ${o.ens_minus_book_logloss.mean} [${o.ens_minus_book_logloss.ci}].
${o.model_plus_market?` Separate <b>model + market</b> variant (uses average pre-closing odds as an input, never closing odds): log loss ${o.model_plus_market.log_loss} vs pre-closing market ${o.bookmaker_prematch_avg.log_loss} and closing ${o.bookmaker_closing_on_market_subset.log_loss} on the same ${o.model_plus_market.n} matches – no meaningful gain over the market.`:''}</p>
<div class=overflow-x-auto><table class="text-xs w-full mt-2"><tr class=text-slate-400><th class=text-left>League</th><th>n</th><th>v0.1 LL</th><th>v0.2 LL</th><th>Δ [95% CI]</th><th>v0.2 RPS</th><th>Closing-odds LL</th><th>v0.2 − book [95% CI]</th></tr>${Object.entries(p.by_league).map(([k,b])=>`<tr class="border-t border-slate-800"><td>${k}</td><td>${b.n_matches}</td><td>${b.ens_v01?b.ens_v01.log_loss:'–'}</td><td>${b.ens.log_loss}</td><td>${b.v02_minus_v01?b.v02_minus_v01.log_loss+' ['+b.v02_minus_v01.log_loss_ci+']':'–'}</td><td>${b.ens.rps}</td><td>${b.bookmaker_closing?b.bookmaker_closing.log_loss:'n/a'}</td><td>${b.ens_minus_book_logloss?b.ens_minus_book_logloss.mean+' ['+b.ens_minus_book_logloss.ci+']':'–'}</td></tr>`).join('')}</table></div>
<p class="text-xs text-slate-400 mt-1">PSL: season-ahead backtest only (no dates/odds/shots); v0.2 there = joint DC with promoted-team prior.</p></div>
<div class="grid lg:grid-cols-2 gap-4"><div class=card><h3 class=font-bold>Calibration</h3><canvas id=cal></canvas></div><div class=card><h3 class=font-bold>RPS by league</h3><canvas id=lg></canvas></div></div>`}
function settings(){const s=S.settings;return `<div class="card max-w-xl"><h2 class="font-bold mb-3">Settings</h2><div class="mb-3"><div class="text-sm text-slate-400 mb-1">Leagues</div>${Object.entries(S.status.leagues).map(([k,v])=>`<label class="block text-sm"><input type=checkbox class=lg value="${k}" ${s.leagues.includes(k)?'checked':''}> ${k} – ${v}</label>`).join('')}</div>
<div class=mb-3><div class="text-sm text-slate-400">Timezone</div><div>${s.timezone}</div></div><label class="block mb-3"><input id=bet type=checkbox ${s.betting_module?'checked':''}> Enable betting/odds module (18+, gamble responsibly)</label>
<button onclick="save()" class="bg-blue-700 px-4 py-2 rounded">Save</button></div>`}
async function save(){S.settings=await fetch('/api/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({leagues:[...document.querySelectorAll('.lg:checked')].map(x=>x.value),betting_module:document.getElementById('bet').checked})}).then(r=>r.json());await loadFx();alert('Saved')}
async function route(){nav();const [p,id]=location.hash.slice(1).split('/');const el=document.getElementById('app');
el.innerHTML=await ({home,match:()=>match(id),pred,odds,perf,settings}[p||'home']||home)()}
window.onhashchange=route;load().then(route);
</script></body></html>
