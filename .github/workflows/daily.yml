name: daily-refresh
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      backtest:
        description: "Run full backtest"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: daily-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: Run pipeline
        run: |
          ARGS=""
          if [ "$(date -u +%u)" = "1" ] || [ "${{ inputs.backtest }}" = "true" ]; then ARGS="--backtest"; fi
          python pipeline.py $ARGS
      - name: Tests
        run: python -m pytest -q tests
      - name: Commit data and reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898169+github-actions[bot]@users.noreply.github.com"
          git add -A data reports
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Daily refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main
          git push origin HEAD:main
